<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PlannerXD — Personal & Professional Operating System</title>
<meta name="description" content="Run the business. Don't let it run you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Georgia:wght@400;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<style>
/* ═══════════════════════════════════════
   PLANNERXD — DESIGN SYSTEM
═══════════════════════════════════════ */
:root {
  --bg: #060e1c;
  --bg2: #0a1628;
  --bg3: #0f1e36;
  --card: #0d1a30;
  --card2: #111f38;
  --border: rgba(110,145,210,.12);
  --border2: rgba(110,145,210,.2);
  --amber: #f59e0b;
  --amber2: #d97706;
  --amber-border: rgba(245,158,11,.25);
  --blue: #3b82f6;
  --blue2: #1d4ed8;
  --green: #10b981;
  --red: #ef4444;
  --gold: #f59e0b;
  --purple: #8b5cf6;
  --teal: #14b8a6;
  --text: #eaf0fb;
  --muted: #6e91b4;
  --muted2: #4a6a8a;
  --sidebar-w: 240px;
  --header-h: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: none; background: none; }
input, textarea, select {
  background: rgba(8,19,37,.8);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  padding: 10px 12px;
  outline: none;
  width: 100%;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--amber);
  box-shadow: 0 0 0 3px rgba(245,158,11,.1);
}
select option { background: var(--bg2); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── AUTH SCREEN ── */
#authScreen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  background: radial-gradient(ellipse at 30% 50%, rgba(245,158,11,.06) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 20%, rgba(59,130,246,.06) 0%, transparent 60%),
              var(--bg);
}
.auth-card {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 48px 40px;
  width: 100%;
  max-width: 400px;
  text-align: center;
}
.auth-logo {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-bottom: 32px;
}
.auth-logo-mark {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--amber), var(--amber2));
  border-radius: 12px;
  display: grid; place-items: center;
  font-size: 22px; font-weight: 900; color: var(--bg);
}
.auth-logo-name {
  font-size: 22px; font-weight: 800; letter-spacing: 1px;
  color: var(--text);
}
.auth-logo-name span { color: var(--amber); }
.auth-tagline { color: var(--muted); font-size: 14px; margin-bottom: 40px; line-height: 1.6; }
.auth-tagline strong { color: var(--text); font-weight: 600; }
.btn-google {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%;
  background: var(--text); color: #1a1a2e;
  border-radius: 12px; padding: 14px 20px;
  font-weight: 700; font-size: 15px;
  transition: opacity .15s;
}
.btn-google:hover { opacity: .9; }
.btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
.auth-footer { margin-top: 24px; font-size: 11px; color: var(--muted2); }

/* ── APP SHELL ── */
#appShell { display: none; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 100;
  transition: transform .25s ease;
}
.sidebar-logo {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo-mark {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--amber), var(--amber2));
  border-radius: 8px;
  display: grid; place-items: center;
  font-size: 16px; font-weight: 900; color: var(--bg);
  flex-shrink: 0;
}
.sidebar-logo-name {
  font-size: 16px; font-weight: 800; letter-spacing: .5px;
}
.sidebar-logo-name span { color: var(--amber); }

/* Tab switcher */
.sidebar-tabs {
  display: flex; margin: 12px 12px 8px;
  background: rgba(8,19,37,.6);
  border-radius: 10px; padding: 3px;
  border: 1px solid var(--border);
}
.sidebar-tab {
  flex: 1; padding: 7px 4px;
  border-radius: 8px;
  font-size: 11px; font-weight: 700;
  color: var(--muted);
  text-align: center;
  transition: all .15s;
}
.sidebar-tab.active {
  background: linear-gradient(135deg, var(--amber), var(--amber2));
  color: var(--bg);
}

.sidebar-section { padding: 4px 8px; }
.sidebar-label {
  font-size: 9px; font-weight: 800; letter-spacing: 1.5px;
  color: var(--muted2); text-transform: uppercase;
  padding: 8px 8px 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 10px;
  border-radius: 8px; margin-bottom: 2px;
  color: var(--muted); font-size: 13px; font-weight: 500;
  text-align: left; transition: all .12s;
}
.nav-item:hover { background: rgba(110,145,210,.07); color: var(--text); }
.nav-item.active {
  background: rgba(245,158,11,.1);
  color: var(--amber);
  font-weight: 600;
  border: 1px solid rgba(245,158,11,.15);
}
.nav-item .nav-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
.nav-item .nav-badge {
  margin-left: auto;
  background: var(--amber); color: var(--bg);
  font-size: 10px; font-weight: 800;
  padding: 2px 6px; border-radius: 8px;
}

.sidebar-foot {
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding: 12px;
}
.user-card {
  display: flex; align-items: center; gap: 10px;
  padding: 8px; border-radius: 10px;
  transition: background .12s;
}
.user-card:hover { background: rgba(110,145,210,.07); }
.user-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  display: grid; place-items: center;
  font-size: 12px; font-weight: 800; color: #fff;
  flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 12px; font-weight: 700; color: var(--text); }
.user-role { font-size: 10px; color: var(--muted); }
.sync-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(16,185,129,.2);
}

/* ── MAIN CONTENT ── */
.main {
  margin-left: var(--sidebar-w);
  height: 100vh;
  overflow-y: auto;
  display: flex; flex-direction: column;
}

/* ── TOPBAR ── */
.topbar {
  height: var(--header-h);
  background: rgba(6,14,28,.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: sticky; top: 0; z-index: 50;
  flex-shrink: 0;
}
.topbar-title { font-size: 15px; font-weight: 700; }
.topbar-sub { font-size: 12px; color: var(--muted); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.mobile-menu-btn {
  display: none;
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  align-items: center; justify-content: center;
  font-size: 18px; color: var(--text);
}

/* ── PAGE CONTENT ── */
.page { padding: 24px; max-width: 1400px; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-header { margin-bottom: 24px; }
.page-eyebrow { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.page-title { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--muted); }
.page-actions { display: flex; gap: 8px; margin-top: 16px; }

/* ── BUTTONS ── */
.btn {
  padding: 8px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 600;
  border: 1px solid var(--border2);
  color: var(--text); transition: all .12s;
}
.btn:hover { border-color: var(--amber); color: var(--amber); }
.btn-amber {
  background: linear-gradient(135deg, var(--amber), var(--amber2));
  color: var(--bg); border: none;
  padding: 9px 18px; border-radius: 8px;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 4px 12px rgba(245,158,11,.25);
  transition: opacity .12s;
}
.btn-amber:hover { opacity: .9; }
.btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 6px; }
.btn-ghost { color: var(--muted); font-size: 12px; font-weight: 600; }
.btn-ghost:hover { color: var(--amber); }

/* ── CARDS ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 20px;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.card-title { font-size: 14px; font-weight: 700; }
.card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ── COMMAND STRIP ── */
.command-strip {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-bottom: 24px;
}
.command-tile {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
  display: flex; align-items: center; gap: 12px;
}
.command-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  font-size: 18px; flex-shrink: 0;
}
.command-icon.red { background: rgba(239,68,68,.15); }
.command-icon.blue { background: rgba(59,130,246,.15); }
.command-icon.amber { background: rgba(245,158,11,.15); }
.command-icon.green { background: rgba(16,185,129,.15); }
.command-label strong { font-size: 13px; font-weight: 700; display: block; }
.command-label small { font-size: 10px; color: var(--muted); }

/* ── TASK LIST ── */
.task-list { display: flex; flex-direction: column; gap: 2px; }
.task-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 10px;
  background: var(--card); border: 1px solid var(--border);
  transition: border-color .12s;
}
.task-item:hover { border-color: var(--border2); }
.task-item.done { opacity: .5; }
.task-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border2);
  display: grid; place-items: center;
  flex-shrink: 0; font-size: 11px; color: transparent;
  transition: all .12s;
}
.task-check:hover { border-color: var(--green); color: var(--green); }
.task-item.done .task-check { background: var(--green); border-color: var(--green); color: #fff; }
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 13px; font-weight: 600; }
.task-note { font-size: 11px; color: var(--muted); margin-top: 2px; }
.task-item.done .task-title { text-decoration: line-through; }
.task-q-badge {
  font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 6px;
  flex-shrink: 0;
}
.task-q-badge.do { background: rgba(239,68,68,.15); color: #ef4444; }
.task-q-badge.schedule { background: rgba(59,130,246,.15); color: var(--blue); }
.task-q-badge.delegate { background: rgba(245,158,11,.15); color: var(--amber); }
.task-q-badge.eliminate { background: rgba(110,145,210,.1); color: var(--muted); }
.task-del { color: var(--muted); font-size: 18px; padding: 0 4px; }
.task-del:hover { color: var(--red); }

/* ── EISENHOWER MATRIX ── */
.matrix-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 12px; height: calc(100vh - 220px); min-height: 400px;
}
.quadrant {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px;
  display: flex; flex-direction: column; overflow: hidden;
}
.quadrant-head {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 12px; margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.q-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.quadrant-head h3 { font-size: 13px; font-weight: 700; }
.quadrant-head p { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.q-count {
  margin-left: auto; font-size: 11px; font-weight: 700;
  background: rgba(110,145,210,.1); padding: 3px 8px; border-radius: 8px;
}
.quadrant-tasks { flex: 1; overflow-y: auto; }
.q-task {
  display: flex; align-items: center; gap: 8px;
  padding: 8px; border-radius: 8px; margin-bottom: 4px;
  transition: background .1s;
}
.q-task:hover { background: rgba(110,145,210,.05); }
.q-check {
  width: 16px; height: 16px; border-radius: 50%;
  border: 1.5px solid var(--border2);
  flex-shrink: 0; font-size: 9px; color: transparent;
  display: grid; place-items: center;
}
.q-check:hover { border-color: var(--green); color: var(--green); }
.q-task-title { font-size: 12px; flex: 1; }
.q-add {
  margin-top: 8px; color: var(--muted); font-size: 11px;
  padding: 6px; border-radius: 6px;
  display: flex; align-items: center; gap: 4px;
  width: 100%;
}
.q-add:hover { color: var(--amber); background: rgba(245,158,11,.05); }

/* ── PRIORITIES ── */
.priorities-layout { display: grid; grid-template-columns: 1.4fr .9fr; gap: 16px; }
.priority-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 0; border-bottom: 1px solid var(--border);
}
.priority-row:last-child { border: none; }
.priority-info { flex: 1; min-width: 0; }
.priority-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.priority-meta { font-size: 10px; color: var(--muted); }
.priority-bar-wrap { width: 120px; flex-shrink: 0; }
.priority-bar { height: 5px; background: rgba(110,145,210,.15); border-radius: 4px; overflow: hidden; }
.priority-bar-fill { height: 100%; background: linear-gradient(90deg, var(--blue2), var(--blue)); border-radius: 4px; }
.priority-pct { font-size: 11px; font-weight: 700; color: var(--blue); margin-top: 4px; text-align: right; }

.pulse-list { display: flex; flex-direction: column; gap: 0; }
.pulse-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.pulse-row:last-child { border: none; }
.pulse-label { font-size: 11px; color: var(--muted); flex: 1; }
.pulse-val { font-size: 15px; font-weight: 800; }
.pulse-target { font-size: 10px; color: var(--muted); }
.pulse-trend {
  font-size: 10px; font-weight: 700;
  padding: 3px 7px; border-radius: 6px;
}
.pulse-trend.up { background: rgba(16,185,129,.15); color: var(--green); }
.pulse-trend.down { background: rgba(239,68,68,.15); color: var(--red); }

.blockers-list { display: flex; flex-direction: column; gap: 8px; }
.blocker-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 10px;
  background: var(--card); border: 1px solid var(--border);
}
.blocker-sev { width: 3px; height: 32px; border-radius: 4px; flex-shrink: 0; }
.blocker-sev.high { background: var(--red); }
.blocker-sev.medium { background: var(--amber); }
.blocker-sev.low { background: var(--blue); }
.blocker-body { flex: 1; min-width: 0; }
.blocker-title { font-size: 13px; font-weight: 600; }
.blocker-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
.blocker-resolve { font-size: 11px; color: var(--blue); font-weight: 600; }

/* ── KANBAN ── */
.kanban { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; height: calc(100vh - 200px); }
.kanban-col {
  flex: 0 0 240px; background: rgba(8,19,37,.5);
  border: 1px solid var(--border); border-radius: 14px;
  padding: 14px; display: flex; flex-direction: column;
}
.kanban-col-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.kanban-col-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.kanban-col-count {
  font-size: 10px; font-weight: 700;
  background: rgba(110,145,210,.12); padding: 2px 7px; border-radius: 6px;
  color: var(--muted);
}
.kanban-cards { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.kanban-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px;
}
.kanban-card-tag {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  padding: 3px 7px; border-radius: 4px; margin-bottom: 8px; display: inline-block;
  background: rgba(59,130,246,.15); color: var(--blue);
}
.kanban-card-tag.marketing { background: rgba(139,92,246,.15); color: var(--purple); }
.kanban-card-tag.office { background: rgba(16,185,129,.15); color: var(--green); }
.kanban-card-tag.equipment { background: rgba(245,158,11,.15); color: var(--amber); }
.kanban-card-tag.operations { background: rgba(20,184,166,.15); color: var(--teal); }
.kanban-card-title { font-size: 12px; font-weight: 600; line-height: 1.4; margin-bottom: 10px; }
.kanban-card-foot { display: flex; align-items: center; justify-content: space-between; }
.kanban-card-owner {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg3); display: grid; place-items: center;
  font-size: 9px; font-weight: 800; color: var(--muted);
}
.kanban-add {
  margin-top: 8px; color: var(--muted); font-size: 11px;
  padding: 8px; border-radius: 8px; width: 100%;
  border: 1px dashed var(--border);
}
.kanban-add:hover { border-color: var(--amber); color: var(--amber); background: rgba(245,158,11,.04); }

/* ── DAILY PLANNER ── */
.planner-grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
.time-block-list { display: flex; flex-direction: column; gap: 4px; }
.time-block {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 14px; border-radius: 10px;
  background: var(--card); border: 1px solid var(--border);
}
.time-label { font-size: 11px; color: var(--muted); width: 44px; flex-shrink: 0; padding-top: 2px; }
.time-body { flex: 1; }
.time-title { font-size: 13px; font-weight: 600; }
.time-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.time-empty { color: var(--muted2); font-style: italic; font-size: 12px; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(5,12,24,.8);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
  animation: fadeIn .15s ease;
}
.modal {
  background: var(--card); border: 1px solid var(--border2);
  border-radius: 16px; padding: 28px;
  width: 100%; max-width: 440px;
  position: relative;
}
.modal-close {
  position: absolute; right: 16px; top: 16px;
  color: var(--muted); font-size: 20px; line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal h2 { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; display: block; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--muted);
}
.empty-state .empty-icon { font-size: 36px; margin-bottom: 12px; }
.empty-state p { font-size: 13px; }

/* ── SIDEBAR OVERLAY (mobile) ── */
.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(5,12,24,.7); z-index: 99;
}

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: none; }
  .sidebar-overlay.open { display: block; }
  .main { margin-left: 0; }

// ═══════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════
async function loadState() {
  if (!currentUser) return;
  try {
    const doc = await db.collection('plannerxd').doc(currentUser.uid).get();
    if (doc.exists && doc.data().state) {
      state = { ...defaultState, ...doc.data().state };
    }
  } catch(e) { console.warn('Load error:', e); }
  renderCurrentPage();
  updateBadge();
}

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  document.getElementById('syncStatus').textContent = 'Saving...';
  saveTimer = setTimeout(saveState, 600);
}

async function saveState() {
  if (!currentUser) return;
  try {
    await db.collection('plannerxd').doc(currentUser.uid).set({ state, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    document.getElementById('syncStatus').textContent = 'Workspace synced';
  } catch(e) {
    document.getElementById('syncStatus').textContent = 'Save failed';
  }
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tabPersonal').classList.toggle('active', mode === 'personal');
  document.getElementById('tabWork').classList.toggle('active', mode === 'work');
  document.getElementById('navPersonal').style.display = mode === 'personal' ? '' : 'none';
  document.getElementById('navWork').style.display = mode === 'work' ? '' : 'none';
  nav(mode === 'personal' ? 'today' : 'matrix');
}

function nav(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  const titles = {
    today: 'Today', tasks: 'All Tasks', planner: 'Daily Planner',
    budget: 'Budget', meals: 'Meal Planning',
    matrix: 'Eisenhower Matrix', priorities: 'Priorities & Pulse', kanban: 'Office Kanban'
  };
  document.getElementById('topbarTitle').textContent = titles[page] || page;
  ['today','tasks','planner','budget','meals','matrix','priorities','kanban'].forEach(p => {
    document.getElementById('page' + p.charAt(0).toUpperCase() + p.slice(1)).style.display = p === page ? 'block' : 'none';
  });
  renderCurrentPage();
  closeSidebar();
}

// ═══════════════════════════════════════
// TASK HELPERS
// ═══════════════════════════════════════
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const Q_LABELS = { do: 'Do First', schedule: 'Schedule', delegate: 'Delegate', eliminate: 'Eliminate' };

function taskHTML(t, showBadge = false) {
  return `
    <div class="task-item ${t.done ? 'done' : ''}">
      <button class="task-check" onclick="toggleTask(${t.id})">✓</button>
      <div class="task-body">
        <div class="task-title">${esc(t.title)}</div>
        ${t.note ? `<div class="task-note">${esc(t.note)}</div>` : ''}
      </div>
      ${showBadge ? `<span class="task-q-badge ${t.quadrant}">${Q_LABELS[t.quadrant] || t.quadrant}</span>` : ''}
      <button class="task-del" onclick="deleteTask(${t.id})" title="Delete">×</button>
    </div>`;
}

function toggleTask(id) {
  state.tasks = state.tasks.map(t => t.id === id ? {...t, done: !t.done} : t);
  updateBadge();
  renderCurrentPage();
  scheduleSave();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  updateBadge();
  renderCurrentPage();
  scheduleSave();
}

function updateBadge() {
  const open = state.tasks.filter(t => !t.done).length;
  document.getElementById('badgeToday').textContent = open;
}

// ═══════════════════════════════════════
// ADD MODAL
// ═══════════════════════════════════════
function openAddModal(quadrant) {
  document.getElementById('addModal').style.display = 'flex';
  document.getElementById('addTitle').value = '';
  document.getElementById('addNote').value = '';
  if (quadrant) document.getElementById('addQuadrant').value = quadrant;
  document.getElementById('addType').value = currentMode === 'work' ? 'work' : 'personal';
  setTimeout(() => document.getElementById('addTitle').focus(), 50);
}

function closeAddModal() {
  document.getElementById('addModal').style.display = 'none';
}

document.getElementById('addModal').addEventListener('mousedown', e => {
  if (e.target === document.getElementById('addModal')) closeAddModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAddModal();
});

function addTask() {
  const title = document.getElementById('addTitle').value.trim();
  if (!title) return;
  const task = {
    id: Date.now(),
    title,
    note: document.getElementById('addNote').value.trim(),
    quadrant: document.getElementById('addQuadrant').value,
    type: document.getElementById('addType').value,
    done: false
  };
  state.tasks.push(task);
  closeAddModal();
  updateBadge();
  renderCurrentPage();
  scheduleSave();
}

// ═══════════════════════════════════════
// BLOCKER ACTIONS
// ═══════════════════════════════════════
function resolveBlocker(idx) {
  if (confirm('Mark this blocker as resolved?')) {
    state.blockers.splice(idx, 1);
    renderCurrentPage();
    scheduleSave();
  }
}

function addBlocker() {
  const title = prompt('Blocker description:');
  if (!title?.trim()) return;
  const owner = prompt('Owner:') || 'Travis';
  const severity = prompt('Severity (high / medium / low):')?.toLowerCase() || 'medium';
  state.blockers.push({ id: Date.now(), title: title.trim(), owner, age: '0 days', severity });
  renderCurrentPage();
  scheduleSave();
}

// ═══════════════════════════════════════
// KANBAN ACTIONS
// ═══════════════════════════════════════
function addCard(col) {
  const title = prompt('Card title:');
  if (!title?.trim()) return;
  const tag = prompt('Tag (marketing / office / equipment / operations / website):') || 'office';
  const owner = prompt('Owner initials:') || 'TD';
  state.cards.push({ id: Date.now(), title: title.trim(), tag: tag.toLowerCase(), owner, column: col });
  renderCurrentPage();
  scheduleSave();
}

// MOBILE SIDEBAR

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// BUDGET
// ═══════════════════════════════════════
function renderBudget() {
  const b = state.budget;
  const totalIncome = b.income.reduce((s,i) => s + (Number(i.amount)||0), 0);
  const totalExpenses = b.expenses.reduce((s,i) => s + (Number(i.amount)||0), 0);
  const totalSavings = b.savings.reduce((s,i) => s + (Number(i.amount)||0), 0);
  const net = totalIncome - totalExpenses - totalSavings;
  const netColor = net >= 0 ? 'var(--green)' : 'var(--red)';

  document.getElementById('pageBudget').innerHTML = `
    <div class="page-header">
      <div class="page-eyebrow">Personal Finance</div>
      <div class="page-title">Budget</div>
      <div class="page-sub">Know your numbers. Every dollar has a job.</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px">
      ${[
        {label:'Monthly Income', val:'$'+totalIncome.toLocaleString(), color:'var(--green)'},
        {label:'Monthly Expenses', val:'$'+totalExpenses.toLocaleString(), color:'var(--red)'},
        {label:'Savings', val:'$'+totalSavings.toLocaleString(), color:'var(--blue)'},
        {label:'Net / Surplus', val:(net>=0?'+':'')+net.toLocaleString(), color:netColor},
      ].map(t => `
        <div class="card" style="text-align:center">
          <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${t.label}</div>
          <div style="font-size:22px;font-weight:800;color:${t.color}">${t.val}</div>
        </div>`).join('')}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="card">
        <div class="card-head">
          <div class="card-title">💰 Income</div>
          <button class="btn btn-sm" onclick="addBudgetRow('income')">+ Add</button>
        </div>
        ${b.income.map((item,i) => `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="flex:1;font-size:13px">${esc(item.label)}</div>
            <div style="display:flex;align-items:center;gap:4px">
              <span style="font-size:12px;color:var(--muted)">$</span>
              <input type="number" value="${item.amount}" min="0" step="100"
                style="width:100px;text-align:right;padding:5px 8px;font-size:13px"
                onchange="updateBudgetAmount('income',${i},this.value)">
            </div>
          </div>`).join('')}
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">📤 Expenses</div>
          <button class="btn btn-sm" onclick="addBudgetRow('expenses')">+ Add</button>
        </div>
        ${b.expenses.map((item,i) => `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="flex:1;font-size:13px">${esc(item.label)}</div>
            <div style="display:flex;align-items:center;gap:4px">
              <span style="font-size:12px;color:var(--muted)">$</span>
              <input type="number" value="${item.amount}" min="0" step="100"
                style="width:100px;text-align:right;padding:5px 8px;font-size:13px"
                onchange="updateBudgetAmount('expenses',${i},this.value)">
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">🏦 Savings Goals</div>
        <button class="btn btn-sm" onclick="addBudgetRow('savings')">+ Add</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">
        ${b.savings.map((item,i) => {
          const pct = item.goal > 0 ? Math.min(100, Math.round(item.amount/item.goal*100)) : 0;
          return `
            <div style="background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px">
              <div style="font-size:12px;font-weight:700;margin-bottom:8px">${esc(item.label)}</div>
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
                <span style="font-size:11px;color:var(--muted)">$</span>
                <input type="number" value="${item.amount}" min="0" step="500"
                  style="flex:1;text-align:right;padding:5px 8px;font-size:13px"
                  onchange="updateBudgetAmount('savings',${i},this.value)">
                ${item.goal > 0 ? `<span style="font-size:11px;color:var(--muted)">/ $${Number(item.goal).toLocaleString()}</span>` : ''}
              </div>
              ${item.goal > 0 ? `
                <div style="height:5px;background:rgba(110,145,210,.15);border-radius:4px;overflow:hidden">
                  <div style="height:100%;width:${pct}%;background:var(--blue);border-radius:4px"></div>
                </div>
                <div style="font-size:10px;color:var(--muted);margin-top:4px">${pct}% of goal</div>` : ''}
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

function updateBudgetAmount(category, idx, val) {
  state.budget[category][idx].amount = parseFloat(val) || 0;
  scheduleSave();
  renderBudget();
}

function addBudgetRow(category) {
  const label = prompt(`${category.charAt(0).toUpperCase()+category.slice(1)} label:`);
  if (!label?.trim()) return;
  if (category === 'savings') {
    const goal = parseFloat(prompt('Savings goal amount (or 0 for none):')) || 0;
    state.budget.savings.push({ id: Date.now(), label: label.trim(), amount: 0, goal });
  } else {
    state.budget[category].push({ id: Date.now(), label: label.trim(), amount: 0, note: '' });
  }
  renderBudget();
  scheduleSave();
}

function renderMeals() {
  const m = state.meals;
  document.getElementById('pageMeals').innerHTML = `
    <div class="page-header">
      <div class="page-eyebrow">Personal</div>
      <div class="page-title">Meal Planning</div>
      <div class="page-sub">Plan the week. Build the list. Eat well.</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start">
      <div class="card">
        <div class="card-head">
          <div class="card-title">📅 This Week</div>
        </div>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead>
              <tr>
                <th style="text-align:left;padding:8px;color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border)">Day</th>
                <th style="text-align:left;padding:8px;color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border)">Breakfast</th>

                <th style="text-align:left;padding:8px;color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border)">Dinner</th>
              </tr>
            </thead>
            <tbody>
              ${m.days.map(day => `
                <tr style="border-bottom:1px solid var(--border)">
                  <td style="padding:8px;font-weight:700;color:var(--amber);white-space:nowrap">${day}</td>
                  ${['breakfast','lunch','dinner'].map(meal => `
                    <td style="padding:4px">
                      <input type="text" value="${esc(m.plan[day]?.[meal]||'')}"
                        placeholder="—"
                        style="background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:6px 4px;font-size:12px;width:100%"
                        onchange="updateMeal('${day}','${meal}',this.value)"
                        onfocus="this.style.borderColor='var(--amber)'"
                        onblur="this.style.borderColor='var(--border)'">
                    </td>`).join('')}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">🛒 Grocery List</div>
          <button class="btn btn-sm" onclick="addGroceryItem()">+ Add</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${m.groceries.map((item,i) => `
            <div style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" ${item.done?'checked':''} onchange="toggleGrocery(${i})" style="width:16px;height:16px;flex-shrink:0;accent-color:var(--amber)">
              <span style="flex:1;font-size:13px;${item.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(item.name)}</span>
              <button onclick="removeGrocery(${i})" style="color:var(--muted);font-size:14px">×</button>
            </div>`).join('')}
          ${!m.groceries.length ? '<div style="font-size:12px;color:var(--muted);font-style:italic">No items yet. Add groceries above.</div>' : ''}
        </div>
        ${m.groceries.some(g=>g.done) ? `<button class="btn btn-sm" style="margin-top:12px;width:100%" onclick="clearDoneGroceries()">Clear completed</button>` : ''}
      </div>
    </div>`;
}

function updateMeal(day, meal, value) {
  if (!state.meals.plan[day]) state.meals.plan[day] = {};
  state.meals.plan[day][meal] = value;
  scheduleSave();
}

function addGroceryItem() {
  const item = prompt('Add grocery item:');
  if (!item?.trim()) return;
  state.meals.groceries.push({ name: item.trim(), done: false });
  renderMeals();
  scheduleSave();
}

function toggleGrocery(idx) {
  state.meals.groceries[idx].done = !state.meals.groceries[idx].done;
  renderMeals();
  scheduleSave();
}

function removeGrocery(idx) {
  state.meals.groceries.splice(idx, 1);
  renderMeals();
  scheduleSave();
}

function clearDoneGroceries() {
  state.meals.groceries = state.meals.groceries.filter(g => !g.done);
  renderMeals();
  scheduleSave();
}
